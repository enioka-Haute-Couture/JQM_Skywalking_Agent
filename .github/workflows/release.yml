name: Release

on:
  push:
    tags:
      # Only trigger on semver tags (e.g., 1.0.0, 2.1.3)
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
      
      - name: Rename JAR file
        id: jar
        run: |
          JAR_FILE=$(find target -name "jqm-plugin-*.jar" -not -name "*-sources.jar" | head -n 1)
          RENAMED_JAR="target/jqm-server-${{ github.ref_name }}-plugin.jar"
          mv "$JAR_FILE" "$RENAMED_JAR"
          echo "JAR_PATH=$RENAMED_JAR" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ steps.jar.outputs.JAR_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
